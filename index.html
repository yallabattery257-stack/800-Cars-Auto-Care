
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>800 Car Auto Care | Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#111111;
    color:#ffffff;
}

.login-container{
    width:100%;
    max-width:420px;
    background:#1c1c1c;
    border:1px solid #383838;
    border-radius:16px;
    padding:35px 30px;
    box-shadow:0 15px 50px rgba(0,0,0,.5);
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo-icon{
    width:65px;
    height:65px;
    margin:0 auto 15px;
    border:2px solid #e32636;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#e32636;
    font-size:30px;
    font-weight:bold;
}

.logo h1{
    font-size:27px;
    font-weight:800;
    letter-spacing:1px;
}

.logo h1 span{
    color:#e32636;
}

.logo p{
    margin-top:8px;
    color:#aaaaaa;
    font-size:11px;
    letter-spacing:2px;
}

.heading{
    text-align:center;
    margin-bottom:25px;
}

.heading h2{
    font-size:21px;
    margin-bottom:7px;
}

.heading p{
    font-size:13px;
    color:#999999;
}

.form-group{
    margin-bottom:19px;
}

label{
    display:block;
    font-size:13px;
    margin-bottom:9px;
    color:#dddddd;
    font-weight:600;
}

.input-box{
    position:relative;
}

input{
    width:100%;
    height:49px;
    padding:0 14px;
    border:1px solid #444444;
    border-radius:7px;
    outline:none;
    background:#292929;
    color:white;
    font-size:14px;
}

input:focus{
    border-color:#e32636;
    box-shadow:0 0 0 2px rgba(227,38,54,.12);
}

input::placeholder{
    color:#777777;
}

.password-input{
    padding-right:65px;
}

.show-password{
    position:absolute;
    right:13px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:#e32636;
    font-size:12px;
    cursor:pointer;
}

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:5px 0 23px;
    font-size:12px;
}

.remember{
    display:flex;
    align-items:center;
    gap:7px;
    color:#bbbbbb;
}

.remember input{
    width:14px;
    height:14px;
    accent-color:#e32636;
}

.forgot{
    color:#e32636;
    text-decoration:none;
}

.login-btn{
    width:100%;
    height:49px;
    background:#e32636;
    border:none;
    border-radius:7px;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.login-btn:hover{
    background:#c91d2b;
    transform:translateY(-1px);
}

.message{
    display:none;
    margin-top:16px;
    padding:12px;
    border-radius:6px;
    background:#302020;
    border:1px solid #713037;
    color:#ffaaaa;
    font-size:12px;
    line-height:1.5;
}

.footer{
    margin-top:28px;
    padding-top:18px;
    border-top:1px solid #383838;
    text-align:center;
    color:#777777;
    font-size:11px;
    line-height:1.8;
}

.footer span{
    color:#e32636;
}

@media(max-width:480px){
    .login-container{
        padding:30px 22px;
    }

    .logo h1{
        font-size:24px;
    }
}
</style>
</head>

<body>

<div class="login-container">

    <div class="logo">
        <div class="logo-icon">800</div>
        <h1>800 CAR <span>AUTO CARE</span></h1>
        <p>PROFESSIONAL AUTOMOTIVE SERVICES</p>
    </div>

    <div class="heading">
        <h2>Welcome Back</h2>
        <p>Login to access your Garage Management System</p>
    </div>

    <form id="loginForm">

        <div class="form-group">
            <label for="username">Username / Email</label>
            <input
                type="text"
                id="username"
                placeholder="Enter your username or email"
                autocomplete="username"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <div class="input-box">
                <input
                    type="password"
                    id="password"
                    class="password-input"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword()"
                >SHOW</button>
            </div>
        </div>

        <div class="options">
            <label class="remember">
                <input type="checkbox" id="remember">
                Remember me
            </label>

            <a href="#" class="forgot" onclick="forgotPassword(event)">
                Forgot Password?
            </a>
        </div>

        <button type="submit" class="login-btn">
            LOGIN TO CRM
        </button>

        <div class="message" id="message"></div>

    </form>

    <div class="footer">
        <p>800 Car Auto Care CRM</p>
        <p>Secure Garage Management System</p>
        <p>© 2026 <span>800 Car Auto Care</span>. All Rights Reserved.</p>
    </div>

</div>

<script>

// LOGIN CREDENTIALS
const ADMIN_USERNAME = "Shoaib";
const ADMIN_PASSWORD = "Shoaib@800";

function togglePassword(){

    const password = document.getElementById("password");
    const button = document.querySelector(".show-password");

    if(password.type === "password"){
        password.type = "text";
        button.textContent = "HIDE";
    }else{
        password.type = "password";
        button.textContent = "SHOW";
    }
}

function forgotPassword(event){
    event.preventDefault();

    showMessage(
        "Please contact your CRM administrator to reset your password."
    );
}

function showMessage(text){

    const message = document.getElementById("message");

    message.style.display = "block";
    message.textContent = text;
}

document.getElementById("loginForm").addEventListener("submit",function(event){

    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    if(username === ADMIN_USERNAME && password === ADMIN_PASSWORD){

        sessionStorage.setItem("800carcare_logged_in","true");

        window.location.href = "dashboard.html";

    }else{

        showMessage("Invalid username or password. Please try again.");

    }

});

</script>

</body>
</html>
